<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <title>Save the Hero!</title>
    
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000; /* 남는 여백은 깔끔한 블랙 처리 */
            overflow: hidden;
            position: fixed;
            /* 모바일 당겨서 새로고침 및 스크롤 바운스 완전 차단 */
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 🚨 무분별한 !important를 제거하여 Phaser의 스케일 매니저와 충돌을 방지합니다. */
        canvas {
            image-rendering: pixelated; /* 모바일 크기 변화 시 흐려짐 방지 */
            -webkit-tap-highlight-color: transparent; /* 모바일 터치 시 푸른 반투명 박스 제거 */
        }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <script src="game.js"></script>

</body>
</html>
